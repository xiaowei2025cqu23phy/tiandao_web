name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 注意：本应用使用根路径资源（/manifest.webmanifest、/sw.js、/icons/...），
# 仅适用于「用户站」或自定义域名的根路径部署。
# 若部署到项目子路径（https://<user>.github.io/<repo>/），需在 vite.config.ts 设置 base
# 并把 manifest / sw / 图标路径改为相对路径，否则 PWA 与静态资源会 404。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
